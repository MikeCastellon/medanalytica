query GetSubjectHeartDataRange(
  $id: String!
  $order_by: order_by
  $start_date: timestamptz
  $end_date: timestamptz
) {
  heart_data(
    order_by: { created_on: $order_by }
    where: {
      owner: { _eq: $id }
      deleted_on: { _is_null: true }
      _and: [
        { created_on: { _gte: $start_date } }
        { created_on: { _lte: $end_date } }
      ]
    }
  ) {
    id
    title
    data
    created_on
    trend_recording
    rr_file {
      id
    }
    ecg_file {
      id
    }
    rr_metadata {
      id
      max
      mean
      min
      owner_id
      threshold
      total_filtered_rr
      total_rejected
      total_rr
    }
  }
}

query GetUserFollowing($userId: String!) {
  all: followers_aggregate(
    where: { follower_id: { _eq: $userId }, deleted_on: { _is_null: true } }
  ) {
    aggregate {
      count
    }
  }
  accepted: followers_aggregate(
    where: { follower_id: { _eq: $userId }, accepted_on: { _is_null: false } }
  ) {
    aggregate {
      count
    }
  }
  pending: followers_aggregate(
    where: {
      follower_id: { _eq: $userId }
      accepted_on: { _is_null: true }
      deleted_on: { _is_null: true }
    }
  ) {
    aggregate {
      count
    }
  }
  followers(
    where: { follower_id: { _eq: $userId }, deleted_on: { _is_null: true } }
  ) {
    accepted_on
    requested_on
    id
    followee_id
  }
}

query GetFollowingByPartiesId($follower_id: String, $followee_id: String) {
