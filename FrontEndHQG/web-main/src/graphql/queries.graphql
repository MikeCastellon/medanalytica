query GetSpecificExplanation(
  $age: GraphQLStringOrFloat!
  $status: String
  $gender: [String]
) {
  match(
    filter: {
      max_age: { _gte: $age }
      min_age: { _lte: $age }
      gender: { _in: $gender }
      status: { _eq: $status }
    }
  ) {
    refKey {
      id
    }
    max
    min
    max_age
    min_age
    gender
    status
    explanation {
      title
      explanation
    }
  }
}

query GetSpecificExplanationByKeyValue(
  $age: GraphQLStringOrFloat!
  $status: String = "published"
  $value: GraphQLStringOrFloat!
  $refKey: String!
  $gender: [String] = ["all"]
) {
  match(
    filter: {
      max_age: { _gte: $age }
      min_age: { _lte: $age }
      gender: { _in: $gender }
      status: { _eq: $status }
      max: { _gte: $value }
      min: { _lte: $value }
      refKey: { id: { _eq: $refKey } }
    }
  ) {
    refKey {
      id
    }
    max
    min
    max_age
    min_age
    gender
    status
    explanation {
      title
      explanation
    }
  }
}

